[project]
name = "traffic-sim"
version = "0.1.0"
description = "Freeway traffic simulator with multi-lane IDM model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pygame>=2.5.0",
    "numpy>=1.24.0",
    "polars>=1.38.1",
]

[project.scripts]
traffic-sim = "traffic_sim.main:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
